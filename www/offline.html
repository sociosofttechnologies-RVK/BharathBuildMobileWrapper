<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>BharathBuild – Offline</title>
  <style>
    :root { color-scheme: light dark; }
    html, body { height: 100%; margin: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex; align-items: center; justify-content: center;
      background: #F8F9FB; color: #0D2B45; padding: 24px; box-sizing: border-box; text-align: center;
    }
    @media (prefers-color-scheme: dark) { body { background: #111; color: #eee; } }
    .icon { font-size: 56px; margin-bottom: 12px; }
    h1 { font-size: 20px; margin: 0 0 8px; }
    p { margin: 0 0 24px; opacity: .7; line-height: 1.4; }
    button {
      font: inherit; font-weight: 600; border: 0; border-radius: 12px;
      padding: 14px 28px; background: #F97316; color: #fff; min-width: 160px;
    }
  </style>
</head>
<body>
  <div>
    <div class="icon">📡</div>
    <h1>You're offline</h1>
    <p>Check your internet connection and try again.</p>
    <button onclick="retry()">Try again</button>
  </div>
  <script src="app-url.js"></script>
  <script>
    function retry() {
      if (window.APP_URL) { window.location.href = window.APP_URL; } else { window.location.reload(); }
    }
    window.addEventListener('online', retry);
  </script>
</body>
</html>
